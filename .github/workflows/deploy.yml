name: Publicar portfólio no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar conteúdo
        run: node tools/check-content.mjs

      # O artefato é montado por lista explícita, nunca pela raiz inteira:
      # publicar "." levaria junto tools/ e qualquer anotação interna.
      - name: Montar o site
        run: |
          mkdir -p _site/data _site/cv
          cp index.html 404.html styles.css script.js _site/
          cp cv.html cv.css cv.js _site/
          cp data/content.js _site/data/
          cp cv/*.pdf _site/cv/
          touch _site/.nojekyll
          if [ -d assets ]; then cp -r assets _site/; fi
          if [ -f og.png ]; then cp og.png _site/; fi
          echo "--- publicando ---" && find _site -type f | sort

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
